version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"

  # pyproject.toml's lower bounds are the oldest versions alai supports.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    versioning-strategy: increase-if-necessary
    groups:
      uv:
        patterns:
          - "*"

  # Cargo.lock decides what's built into the wheel, so the requirements in src/rust/Cargo.toml only move
  # for a release outside them, such as pyo3 0.31.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    versioning-strategy: increase-if-necessary
    groups:
      cargo:
        patterns:
          - "*"
