name: Alai CLI CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  release:
    types:
    - published

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Verify tag matches project version
        if: startsWith(github.event.release.tag_name, 'v')
        run: |
          PROJECT_VERSION="$(uv version --short)"
          GITHUB_EVENT_RELEASE_TAG_NAME="${{ github.event.release.tag_name }}"
          if [ "${GITHUB_EVENT_RELEASE_TAG_NAME}" != "v${PROJECT_VERSION}" ]; then
            echo "::error::Tag ${GITHUB_EVENT_RELEASE_TAG_NAME} does not match project version ${PROJECT_VERSION}"
            exit 1
          fi

      - name: Build
        run: uv build

      - name: Smoke test
        run: uvx --from ./dist/*.whl alai

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/alai/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        if: startsWith(github.event.release.tag_name, 'v')
