name: Alai CLI CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  release:
    types:
    - published

permissions:
  contents: read

jobs:
  sanity:
    name: Sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Check uv.lock is up to date
        run: uv lock --check

      - name: Run sanity checks
        run: uv run tox run -f sanity

  build:
    name: Build
    needs: sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Verify tag matches project version
        if: startsWith(github.event.release.tag_name, 'v')
        run: |
          PROJECT_VERSION="$(uv version --short)"
          if [ "${GITHUB_REF_NAME}" != "v${PROJECT_VERSION}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match project version ${PROJECT_VERSION}"
            exit 1
          fi

      - name: Build
        run: uv build

      - name: Smoke test
        run: uvx --from ./dist/*.whl alai --version

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"
        # macOS has its own code (clonefile for link_mode clone, which APFS always supports, where the Linux runners'
        # ext4 can't clone at all) and TLS verification through the Security framework; the oldest and newest Python
        # cover it.
        include:
          - os: macos-latest
            python-version: "3.10"
          - os: macos-latest
            python-version: "3.15"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Run tests
        run: |
          TOX_PYTHON="py$(echo '${{ matrix.python-version }}' | tr -d .)"
          uv run tox run -f "${TOX_PYTHON}" --installpkg dist/*.whl
        env:
          PYTEST_ADDOPTS: --color=yes

  publish:
    name: Publish to PyPI
    needs: test
    runs-on: ubuntu-latest
    if: startsWith(github.event.release.tag_name, 'v')
    environment:
      name: pypi
      url: https://pypi.org/project/alai/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
