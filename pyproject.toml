[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[project]
name = "alai"
version = "0.0.1"
description = "A fast package and environment manager for Ansible collections (in development)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jordan Borean" }]
requires-python = ">=3.10"
keywords = ["ansible", "collections", "galaxy", "package-manager"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Installation/Setup",
    "Topic :: System :: Systems Administration",
]

[project.scripts]
alai = "alai.__main__:main"
