[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[project]
name = "alai"
version = "0.0.1"
description = "A fast package and environment manager for Ansible collections."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jordan Borean" }]
requires-python = ">=3.10"
keywords = ["ansible", "collections", "galaxy", "package-manager"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Installation/Setup",
    "Topic :: System :: Systems Administration",
]

dependencies = [
    # Older releases fail on the argparse internals of current Python 3.12 and later releases.
    "argcomplete >= 3.5.2",
    "tomli >= 1.1.0; python_version < '3.11'",
    # galaxy.yml and meta/runtime.yml, read with the same parser ansible-core uses.
    "pyyaml >= 6.0",
    # Dependency resolution, as pip and ansible-galaxy use; the floor is the release tested.
    "resolvelib >= 1.2",
    # The OS trust store for TLS; the floor is the release tested.
    "truststore >= 0.10",
    "urllib3 >= 2.0",
]

[project.urls]
Documentation = "https://docs.alai.sh/"
Source = "https://github.com/alai-sh/alai-cli"
Issues = "https://github.com/alai-sh/alai-cli/issues"

[project.scripts]
alai = "alai.__main__:main"

[dependency-groups]
dev = [
    "basedpyright >= 1.40.2",
    "coverage[toml] >= 5.3",  # Support for source_pkgs
    "ruff >= 0.17.0",
    "pre-commit",
    "pytest >= 8",
    "pytest-xdist",
    "tox-uv",
    # Type stubs for PyYAML, for basedpyright.
    "types-pyyaml",
    # Lets basedpyright check the Python 3.10 import path.
    "tomli >= 1.1.0",
]
docs = [
    # zensical needs Python 3.11 or later; the marker lets uv still lock this group for 3.10.
    "zensical >= 0.0.71; python_version >= '3.11'",
    # The run recording runs a module with it; pinned so the recording is the same on every build. A release
    # candidate, as 2.21 doesn't run on Python 3.15: move to 2.22.0 once it's out.
    "ansible-core == 2.22.0rc1; python_version >= '3.13'",
]

[tool.uv]
# Rebuild/reinstall the project when source files change (or are deleted),
# not just when pyproject.toml changes. Without this, tox envs keep stale
# copies of removed modules in site-packages which show up in coverage.
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.py" }]

[tool.basedpyright]
include = ["src"]
pythonVersion = "3.10"
exclude = ["tests"]
reportAny = false
# typing.override is 3.12+, and the 3.10 floor would need typing_extensions for it.
reportImplicitOverride = false
reportPrivateUsage = false
reportUnannotatedClassAttribute = false
reportUnknownArgumentType = false
reportUnknownMemberType = false

executionEnvironments = [
    { root = "tests", reportUntypedFunctionDecorator = false }
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "A",     # flake8-builtins, shadowing a builtin
    "B",     # flake8-bugbear, likely bugs
    "C4",    # flake8-comprehensions
    "DTZ",   # flake8-datetimez, naive datetime usage
    "E4",    # pycodestyle imports, E501 is left to the formatter
    "E7",    # pycodestyle statements
    "E9",    # pycodestyle runtime errors
    "F",     # pyflakes, unused imports and undefined names
    "FURB",  # refurb, outdated patterns
    "G",     # flake8-logging-format
    "I",     # isort
    "ICN",   # flake8-import-conventions
    "ISC",   # flake8-implicit-str-concat
    "PERF",  # perflint
    "PIE",   # flake8-pie
    "PTH",   # flake8-use-pathlib
    "RET",   # flake8-return
    "RSE",   # flake8-raise
    "RUF",   # ruff specific rules
    "S",     # flake8-bandit
    "SIM",   # flake8-simplify
    "T20",   # flake8-print
    "UP",    # pyupgrade
    "W",     # pycodestyle warnings
]

ignore = [
    # ISC003 wants an implicit concatenation which basedpyright rejects under
    # reportImplicitStringConcatenation, so an explicit + is the only way to split a
    # message across lines.
    "ISC003",
]

[tool.ruff.lint.per-file-ignores]
# assert is how pytest tests are written and the mutable class attributes are
# parametrize data on classes that are never used to hold instance state.
"tests/**" = ["S101", "RUF012"]
# pathlib costs 1.5-4 ms to import on every command, and more per call in file-heavy loops, so the CLI uses
# os.path with str paths. Tests can use pathlib.
"src/**" = ["PTH"]
# The CLI and its message helpers write to the user with print.
"src/alai/_cli.py" = ["T201"]
"src/alai/_commands/**" = ["T201"]
"src/alai/_find.py" = ["T201"]
"src/alai/_output.py" = ["T201"]

# typing and collections.abc are imported as modules, so annotations read _t.Any and _c.Mapping rather than
# a growing list of names.
[tool.ruff.lint.flake8-import-conventions]
banned-from = ["typing", "collections.abc"]

[tool.ruff.lint.flake8-import-conventions.extend-aliases]
"typing" = "_t"
"collections.abc" = "_c"

[tool.ruff.lint.isort]
known-first-party = ["alai"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
pythonpath = ["tests"]
testpaths = "tests"
junit_family = "xunit2"

[tool.coverage.paths]
source = ["src", ".tox/py*/**/site-packages"]

[tool.coverage.run]
branch = true
# Needed as tests run with a different cwd, env is set in tox
data_file = "${PROJECT_ROOT}/.coverage"
disable_warnings = ["module-not-imported", "no-data-collected"]
source_pkgs = ["alai"]
parallel = true

[tool.coverage.report]
skip_covered = true
show_missing = true

[tool.tox]
legacy_tox_ini = """
[tox]
env_list =
    sanity
    py3{10,11,12,13,14,15}-tests
min_version = 4.0

[testenv]
package = wheel
wheel_build_env = .pkg
runner = uv-venv-lock-runner

passenv =
    PYTEST_ADDOPTS

set_env =
    tests: COVERAGE_PROCESS_START={toxinidir}/pyproject.toml
    tests: PROJECT_ROOT={toxinidir}

commands_pre =
    tests: python -c 'import pathlib; pathlib.Path("{env_site_packages_dir}/cov.pth").write_text("import coverage; coverage.process_startup()")'

commands =
    sanity: python -m ruff check .
    sanity: python -m ruff format . --check
    sanity: python -m basedpyright --warnings
    tests: python -m coverage run -m pytest -v {posargs:-n auto}

commands_post =
    tests: python -m coverage combine --quiet
    tests: python -m coverage report
    tests: python -m coverage xml

[testenv:sanity]
# As sanity has no pyXY factor in the name, we tell it what intepreter to use
base_python = py315

[testenv:docs]
# Checks the CLI reference matches alai's parser and records its terminal recordings, builds the published docs
# strictly, then checks every link between them, anchors included, which the build doesn't.
base_python = py315
dependency_groups = docs
commands =
    python scripts/cli_reference.py --check
    python scripts/cli_recordings.py
    zensical build --strict
    python scripts/check_doc_links.py
"""
