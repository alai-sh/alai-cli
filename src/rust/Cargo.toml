# alai's native code, built by maturin into the alai package as the private module alai._native (see pyproject.toml);
# a member of the workspace in the repository's root Cargo.toml, which holds the build profile.
[package]
name = "alai"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
# Only to name the proxy a request went through in an error, by the matcher reqwest uses, so the two never disagree.
http = "1"
hyper-util = { version = "0.1", default-features = false, features = ["client-proxy", "client-proxy-system"] }
# The FICLONE ioctl and macOS's clonefile, which std has no wrapper for.
libc = "0.2"
# The version resolver (see design/resolver.md). 0.4 needs Rust 1.92, which sets the workspace's rust-version.
pubgrub = "0.4"
# The stable ABIs, so three wheels per platform cover every CPython from 3.10: built for 3.10 to 3.14, one abi3 wheel for
# CPython 3.10 and later; for 3.15, one abi3.abi3t wheel (PEP 803) for 3.15 and later, free-threaded or not; and for
# free-threaded 3.14, which has no stable ABI, a cp314t wheel of its own. extension-module, so as not to link libpython,
# is turned on by maturin (pyproject.toml's [tool.maturin] features) rather than here, so a cargo test can still link it.
pyo3 = { version = "0.30", features = ["abi3-py310", "abi3t-py315"] }
# HTTP for the fetcher (see design/index-client.md): rustls with aws-lc-rs, verified by the OS through
# rustls-platform-verifier; HTTP/2 by ALPN, falling back to HTTP/1.1; the proxy environment variables, and macOS's
# settings; and gzip, deflate and zstd, which Cloudflare picks when offered.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "system-proxy", "socks", "gzip", "deflate", "zstd"] }
# Only to recognise reqwest's TLS failures; the same 0.23 reqwest builds.
rustls = { version = "0.23", default-features = false }
# SSL_CERT_FILE and SSL_CERT_DIR, read as OpenSSL reads them, as uv does.
rustls-native-certs = "0.8"
# Uses the CPU's SHA-256 instructions, where it has them, found at runtime. 0.11.1 at least, for the fix to how its
# AArch64 code loads the round constants (RustCrypto/hashes#922).
sha2 = "0.11.1"
# The runtime reqwest runs on; each request blocks its Python thread on it, with the GIL released.
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "sync", "time"] }
