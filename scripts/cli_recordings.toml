# The landing page's and README's comparison, against Galaxy and index.alai.sh,
# with nothing cached: ansible-galaxy and alai each install community.general
# into a project of their own, and alai then into another project from its
# cache, played as if started at the same moment. Each is recorded on its own,
# so neither's downloads slow the other's. Record it again by hand, with
# `python scripts/cli_recordings.py galaxy-comparison`.
[[recording]]
name = "galaxy-comparison"
title = "ansible-galaxy and alai installing community.general"
live = true
directory = "galaxy"
files = { "ansible.cfg" = "[defaults]\ncollections_path = collections\n", "../alai/alai.toml" = "[project]\n", "../another/alai.toml" = "[project]\n" }

[[recording.panes]]
title = "ansible-galaxy"
commands = ["ansible-galaxy collection install community.general"]

[[recording.panes]]
title = "alai"
directory = "../alai"
commands = ["alai add community.general", "cd ../another", "alai add community.general"]

