# The collections the local index serves, by name: each version, and the
# collections it depends on. Versions are taken from Galaxy so the output reads
# as it would for real, but the artifacts hold only a README.
[index]
"ansible.netcommon" = [
    { vers = "8.6.0", deps = { "ansible.utils" = ">=6.0.0" } },
    { vers = "8.7.1", deps = { "ansible.utils" = ">=6.0.0" } },
]
"ansible.posix" = [{ vers = "2.1.0" }, { vers = "2.2.2" }]
# 6.1.1 is the real collection, downloaded from the index's artifact store, for
# the recording that runs a module from it; it has no dependencies.
"ansible.utils" = [
    { vers = "6.0.0" },
    { vers = "6.1.1", download = "961b587874b54a0e30e2614ec5c6f673d036cc37b823ed8b164092405f8ada6b" },
]
"cisco.ios" = [
    { vers = "11.5.0", deps = { "ansible.netcommon" = ">=8.1.0", "ansible.posix" = ">=2.0.0" } },
    { vers = "11.6.0", deps = { "ansible.netcommon" = ">=8.1.0", "ansible.posix" = ">=2.0.0" } },
]
"community.docker" = [{ vers = "4.8.1" }]
"community.general" = [{ vers = "10.7.8" }, { vers = "10.7.9" }, { vers = "11.0.0" }]

