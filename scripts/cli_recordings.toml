[[reference."collection install"]]
recording = "collection-install"
description = """
An `alai.toml`, even an empty one, marks the project's directory, and
collections are installed into `collections/` beside it.
"""

[[reference."collection install"]]
recording = "collection-install-subdirectory"
description = """
alai looks for the project from the current directory upwards, so run from
`playbooks/`, it finds the `alai.toml` above and installs into the project's
`collections/`, not one in `playbooks/`.
"""

[[reference."collection install"]]
recording = "collection-install-ansible-cfg"
description = """
An `ansible.cfg` doesn't mark a project, only an `alai.toml` does. Without
one, alai names the nearest `ansible.cfg` or `galaxy.yml` it passed, as the
directory most likely to be the project's root. An empty `alai.toml` there
makes it one.
"""

[[reference."collection install"]]
recording = "collection-install-outside"
description = """
With no `alai.toml` in the current directory or above it, there's no project,
and alai won't guess where to install. `--collections-dir` says where.
"""

[[reference."collection uninstall"]]
recording = "collection-uninstall"
description = """
Only the collections named are uninstalled: the collections `cisco.ios`
needed stay installed.
"""

[[reference."collection uninstall"]]
recording = "collection-uninstall-outside"

[[reference."collection list"]]
recording = "collection-list"
description = """
`cisco.ios` and what it needs are locked. `community.docker` was installed by
hand, `ansible.posix` was installed by hand at an older version, and
`ansible.utils` was uninstalled, so `alai sync` would change all three.
"""

