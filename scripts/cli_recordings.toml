[[reference."collection install"]]
recording = "collection-install"
description = """
An `alai.toml`, even an empty one, marks the project's directory, and
collections are installed into `collections/` beside it.
"""

[[reference."collection install"]]
recording = "collection-install-subdirectory"
description = """
alai looks for the project from the current directory upwards, so run from
`playbooks/`, it finds the `alai.toml` above and installs into the project's
`collections/`, not one in `playbooks/`.
"""

[[reference."collection install"]]
recording = "collection-install-ansible-cfg"
description = """
Without an `alai.toml`, an `ansible.cfg` marks the project's directory too, so
collections still go into `collections/` beside it. alai only uses it to find
the project; it doesn't read Ansible's settings from it.
"""

[[reference."collection install"]]
recording = "collection-install-outside"
description = """
With no `alai.toml`, `ansible.cfg` or `collections/ansible_collections` in the
current directory or above it, there's no project, and alai won't guess where
to install: `--collections-dir` says where.
"""

[[reference."collection uninstall"]]
recording = "collection-uninstall"
description = """
Only the collections named are uninstalled: the collections `cisco.ios`
needed stay installed.
"""

[[reference."collection uninstall"]]
recording = "collection-uninstall-outside"

