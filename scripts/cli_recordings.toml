[[recording]]
name = "run"
title = "Running an Ansible module from a collection just added"
# ansible-core comes from the docs environment. The ansible.cfg only turns off
# the warning that no inventory was parsed, as the module runs on localhost.
files = { "alai.toml" = "[project]\n", "ansible.cfg" = "[inventory]\ninventory_unparsed_warning = False\n" }
commands = [
    "alai add ansible.utils",
    "alai run ansible localhost -m ansible.utils.fact_diff -a 'before=port:80 after=port:8080'",
]

[[recording]]
name = "run-collection-playbook"
title = "Running a collection's playbook by name"
directory = "my_col"
# A collection project: its galaxy.yml, one module and a playbook using it by
# its short name. The ansible.cfg only turns off the warnings that there's no
# inventory, as the playbook runs on localhost.
files."alai.toml" = ""
files."ansible.cfg" = "[defaults]\nlocalhost_warning = False\n\n[inventory]\ninventory_unparsed_warning = False\n"
files."galaxy.yml" = """
namespace: my_ns
name: my_col
version: 1.0.0
readme: README.md
authors: [Example]
"""
files."README.md" = "# my_ns.my_col\n"
files."plugins/modules/hello.py" = """
#!/usr/bin/python
from __future__ import annotations

DOCUMENTATION = r'''
module: hello
short_description: Return a greeting
options:
  name:
    description: Who to greet.
    type: str
    required: true
'''

from ansible.module_utils.basic import AnsibleModule


def main() -> None:
    module = AnsibleModule(argument_spec=dict(name=dict(type='str', required=True)))
    module.exit_json(changed=False, msg=f"Hello, {module.params['name']}!")


if __name__ == '__main__':
    main()
"""
files."playbooks/site.yml" = """
- hosts: localhost
  gather_facts: false
  tasks:
  - name: Greet with the collection's own module, by its short name
    hello:
      name: world
    register: greeting

  - ansible.builtin.debug:
      msg: '{{ greeting.msg }}'
"""
commands = ["cat playbooks/site.yml", "alai run ansible-playbook my_ns.my_col.site"]

[[recording]]
name = "project-playbook"
title = "Running a playbook in a playbook project"
# ansible.utils 6.1.1 is the real collection, so its module runs. The ansible.cfg
# only turns off the warnings that there's no inventory, as the playbook runs on
# localhost.
files."ansible.cfg" = "[defaults]\nlocalhost_warning = False\n\n[inventory]\ninventory_unparsed_warning = False\n"
files."alai.toml" = "[project]\n"
files."site.yml" = """
- hosts: localhost
  gather_facts: false
  tasks:
  - name: Compare two sets of settings with a module from ansible.utils
    ansible.utils.fact_diff:
      before: {port: 80}
      after: {port: 8080}
"""
setup = ["alai add -q ansible.utils"]
commands = ["tree -L 4", "alai run ansible-playbook site.yml"]

