[[recording]]
name = "project-collection"
title = "Testing and running a collection project"
directory = "my_col"
# A collection project needing ansible.utils, the real collection: one module,
# an integration target for it, and a playbook using it by its short name. The
# ansible.cfg only turns off the warnings that there's no inventory, as the
# playbook runs on localhost.
files."alai.toml" = ""
files."ansible.cfg" = "[defaults]\nlocalhost_warning = False\n\n[inventory]\ninventory_unparsed_warning = False\n"
files."galaxy.yml" = """
namespace: my_ns
name: my_col
version: 1.0.0
readme: README.md
authors: [Example]
dependencies:
  ansible.utils: '>=6.0.0'
"""
files."README.md" = "# my_ns.my_col\n"
files."plugins/modules/hello.py" = """
#!/usr/bin/python
from __future__ import annotations

DOCUMENTATION = r'''
module: hello
short_description: Return a greeting
options:
  name:
    description: Who to greet.
    type: str
    required: true
'''

from ansible.module_utils.basic import AnsibleModule


def main() -> None:
    module = AnsibleModule(argument_spec=dict(name=dict(type='str', required=True)))
    module.exit_json(changed=False, msg=f"Hello, {module.params['name']}!")


if __name__ == '__main__':
    main()
"""
files."tests/integration/targets/hello/tasks/main.yml" = """
- name: Greet someone
  my_ns.my_col.hello:
    name: world
  register: greeting

- name: Check the greeting
  ansible.builtin.assert:
    that:
    - greeting.msg == 'Hello, world!'
"""
files."playbooks/site.yml" = """
- hosts: localhost
  gather_facts: false
  tasks:
  - name: Greet with the collection's own module, by its short name
    hello:
      name: world
    register: greeting

  - name: Compare two sets of settings with a module from ansible.utils
    ansible.utils.fact_diff:
      before: {greeting: '{{ greeting.msg }}'}
      after: {greeting: 'Hello, everyone!'}
"""
setup = ["alai sync -q"]
commands = [
    "alai run ansible-test integration hello",
    "alai run ansible-playbook my_ns.my_col.site",
