# The collections the local index serves, by name: each version, and the
# collections it depends on. Versions are taken from Galaxy so the output reads
# as it would for real, but the artifacts hold only a README.
[index]
"ansible.netcommon" = [
    { vers = "8.6.0", deps = { "ansible.utils" = ">=6.0.0" } },
    { vers = "8.7.1", deps = { "ansible.utils" = ">=6.0.0" } },
]
"ansible.posix" = [{ vers = "2.1.0" }, { vers = "2.2.2" }]
# ansible.utils 6.1.1 and community.general 11.0.0 are the real collections,
# downloaded from the index's artifact store, for the recordings that run their
# plugins; neither has dependencies.
"ansible.utils" = [
    { vers = "6.0.0" },
    { vers = "6.1.1", download = "961b587874b54a0e30e2614ec5c6f673d036cc37b823ed8b164092405f8ada6b" },
]
"cisco.ios" = [
    { vers = "11.5.0", deps = { "ansible.netcommon" = ">=8.1.0", "ansible.posix" = ">=2.0.0" } },
    { vers = "11.6.0", deps = { "ansible.netcommon" = ">=8.1.0", "ansible.posix" = ">=2.0.0" } },
]
"community.docker" = [{ vers = "4.8.1" }]
"community.general" = [
    { vers = "10.7.8" },
    { vers = "10.7.9" },
    { vers = "11.0.0", download = "d6b878cc7ef10bc16407caa4f6a66397372714eff9e8795f4f91f0539a7f2702" },
]

[[recording]]
name = "add"
title = "Adding collections to a new project"
files = { "alai.toml" = "[project]\n" }
commands = ["alai add cisco.ios 'community.general<11'", "cat alai.toml", "tree -L 3 collections"]

[[recording]]
name = "add-upgrade"
title = "Upgrading a locked collection while adding another"
files = { "alai.toml" = "[project]\n" }
setup = ["alai add -q 'ansible.posix<2.2'", "sed -i 's/ansible.posix<2.2/ansible.posix>=2.1.0/' alai.toml"]
commands = [
    "grep -A1 'name = \"ansible.posix\"' alai.lock",
    "alai add cisco.ios",
    "alai add community.general -P ansible.posix",
]

