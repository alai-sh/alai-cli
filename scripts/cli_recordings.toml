[[recording]]
name = "add-upgrade"
title = "Upgrading a locked collection while adding another"
files = { "alai.toml" = "[project]\n" }
setup = ["alai add -q 'ansible.posix<2.2'", "sed -i 's/ansible.posix<2.2/ansible.posix>=2.1.0/' alai.toml"]
