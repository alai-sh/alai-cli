[[recording]]
name = "project-collection-dev-group"
title = "A collection project's test-only collections, in its dev group"
directory = "my_col"
# The integration target uses a filter from community.general, which the
# collection itself doesn't need, so it's in the dev group: alai run installs
# that group by default.
files."alai.toml" = ""
files."galaxy.yml" = """
namespace: my_ns
name: my_col
version: 1.0.0
readme: README.md
authors: [Example]
"""
files."README.md" = "# my_ns.my_col\n"
files."plugins/modules/hello.py" = """
#!/usr/bin/python
from __future__ import annotations

DOCUMENTATION = r'''
module: hello
short_description: Return a greeting
options:
  name:
    description: Who to greet.
    type: str
    required: true
'''

from ansible.module_utils.basic import AnsibleModule


def main() -> None:
    module = AnsibleModule(argument_spec=dict(name=dict(type='str', required=True)))
    module.exit_json(changed=False, msg=f"Hello, {module.params['name']}!")


if __name__ == '__main__':
    main()
"""
files."tests/integration/targets/hello/tasks/main.yml" = """
- name: Greet someone
  my_ns.my_col.hello:
    name: world
  register: greeting

- name: Check the greeting, with a filter from community.general
  ansible.builtin.assert:
    that:
    - (greeting.msg | community.general.dict_kv('msg')) == greeting_expected
  vars:
    greeting_expected:
      msg: Hello, world!
"""
commands = [
    "alai add --dev community.general",
    "cat alai.toml",
    "alai run ansible-test integration hello",
]

[[recording]]
name = "remove"
title = "Removing a collection"
files = { "alai.toml" = "[project]\n" }
