[[reference.add]]
recording = "add"

[[reference.add]]
recording = "add-upgrade"
description = """
Here `ansible.posix` is locked at 2.1.0, and 2.2.2 has since been released.

Adding `cisco.ios` leaves `ansible.posix` at 2.1.0. `cisco.ios` needs
`ansible.posix>=2.0.0`, which 2.1.0 still satisfies, and alai doesn't change a
locked version that still works, even when a newer one is out.

Adding `community.general -P ansible.posix` adds `community.general` and
upgrades `ansible.posix`, and only `ansible.posix`, to the newest version that
fits, 2.2.2. `-P` takes the name of the collection to upgrade, which needn't be
one being added: here it's already in `alai.toml`. Give `-P` again to upgrade
more than one, or use `-U` to upgrade every collection.
"""

