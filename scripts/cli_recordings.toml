commands = ["alai remove cisco.ios"]

[[recording]]
name = "lock"
title = "Upgrading one collection, then the rest"
files = { "alai.toml" = """
[project]
collections = ["cisco.ios>=11.5.0", "community.general>=10.7.0"]
""" }
setup = ["alai lock -q", "sed -i 's/11\\.6\\.0/11.5.0/; s/8\\.7\\.1/8.6.0/' alai.lock"]
commands = ["alai lock --upgrade-collection cisco.ios", "alai lock --upgrade", "alai lock --check"]

